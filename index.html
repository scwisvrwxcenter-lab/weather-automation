<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7-Day Weather Outlook</title>
    
    <!-- External CSS styling -->
    <link rel="stylesheet" href="style.css">
    
    <!-- JavaScript execution deferred until body parses -->
    <script src="script.js" defer></script>
</head>
<body>

    <div class="weather-dashboard">
        <header class="dashboard-header">
            <h1 id="outlook-title">Weather Outlook</h1>
            
            <!-- Dynamic location selector tab bar -->
            <div id="location-buttons" class="location-tabs"></div>
            
            <p id="region-label">Loading region data...</p>
        </header>

        <!-- 7-Day Outlook Cards Grid -->
        <div id="forecast-cards-container" class="cards-grid"></div>
        
        <footer id="outlook-summary" class="dashboard-footer">
            Temperatures updated daily in Central Time via NOAA/Open-Meteo runs.
        </footer>
    </div>

</body>
</html>
