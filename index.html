<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automated Weather Forecast Dashboard</title>
    <!-- Include Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; color: #333; }
        .controls { margin-bottom: 20px; }
        select { padding: 8px 12px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; }
        .chart-container { position: relative; height: 400px; width: 100%; background: #fdfdfd; padding: 15px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h1>South-Central WI Severe Weather Center - Forecasting</h1>
    <p>Real-time updates pulled from high-resolution meteorological models.</p>

    <!-- Location Selector Dropdown -->
    <div class="controls">
        <label for="locationSelect"><strong>Select Location:</strong> </label>
        <select id="locationSelect" onchange="updateChart()">
            <!-- Options populated dynamically via JavaScript -->
        </select>
    </div>

    <!-- Chart Canvas -->
    <div class="chart-container">
        <canvas id="weatherChart"></canvas>
    </div>

    <script>
        let weatherData = null;
        let weatherChart = null;

        // Fetch the JSON file generated by your Python script
        async function loadWeatherData() {
            try {
                const response = await fetch('daily_forecast_cache.json');
                weatherData = await response.json();
                
                // Populate dropdown options
                const select = document.getElementById('locationSelect');
                select.innerHTML = '';
                Object.keys(weatherData.forecasts).forEach(location => {
                    const option = document.createElement('option');
                    option.value = location;
                    option.textContent = location.replace('_', ' ');
                    select.appendChild(option);
                });

                // Initial render with the first location
                updateChart();
            } catch (error) {
                console.error('Error loading forecast data:', error);
            }
        }

        // Render or update the Chart.js instance
        function updateChart() {
            if (!weatherData) return;

            const selectedLocation = document.getElementById('locationSelect').value;
            const locData = weatherData.forecasts[selectedLocation];

            // Format timestamp labels into readable hours (e.g., "14:00" or "2 PM")
            const labels = locData.time_slice.map(t => {
                const date = new Date(t);
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            });

            const temps = locData.temperature_2m;
            const precipProbs = locData.precipitation_probability;

            const ctx = document.getElementById('weatherChart').getContext('2d');

            // Destroy previous chart instance if it exists to avoid overlapping graphics
            if (weatherChart) {
                weatherChart.destroy();
            }

            // Create Dual-Axis Chart (Temperature line + Precipitation bar)
            weatherChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Temperature (°F)',
                            data: temps,
                            borderColor: 'rgb(255, 99, 132)',
                            backgroundColor: 'rgba(255, 99, 132, 0.1)',
                            borderWidth: 2,
                            yAxisID: 'y-temp',
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: 'Precipitation Probability (%)',
                            data: precipProbs,
                            type: 'bar',
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            borderColor: 'rgb(54, 162, 235)',
                            borderWidth: 1,
                            yAxisID: 'y-precip'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        'y-temp': {
                            type: 'linear',
                            position: 'left',
                            title: { display: true, text: 'Temperature' }
                        },
                        'y-precip': {
                            type: 'linear',
                            position: 'right',
                            min: 0,
                            max: 100,
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: 'Precipitation Chance (%)' }
                        }
                    }
                }
            });
        }

        // Load data on page load
        loadWeatherData();
    </script>

</body>
</html>
