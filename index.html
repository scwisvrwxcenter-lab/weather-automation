<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Weather Outlook</title>
    
    <!-- Link your CSS styling -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Link your JS loader script -->
    <script src="script.js" defer></script>
</head>
<body>

    <!-- Insert the dashboard structure here -->
    <div class="weather-dashboard">
        <header class="dashboard-header">
            <h1 id="outlook-title">Weather Outlook</h1>
            <p id="region-label">Loading region data...</p>
        </header>

        <!-- 7-Day Cards Container -->
        <div id="forecast-cards-container" class="cards-grid">
            <!-- Cards will be populated here automatically -->
        </div>
        
        <footer id="outlook-summary" class="dashboard-footer">
            <!-- Summary text placeholder -->
        </footer>
    </div>

</body>
</html>
