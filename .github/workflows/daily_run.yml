name: Update Daily Weather Forecast Cache

on:
  schedule:
    - cron: '0 11 * * *' # Runs daily at 11:00 UTC (6:00 AM Central)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests shapely

      - name: Run Forecast Automation Script
        run: python forecast_automation.py

      - name: Commit and Push Updated Cache
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add daily_forecast_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weather forecast cache" && git push)
